<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate customization · Easygenerator prototype</title>
<style>
:root{--bg:#f4f5f7;--pn:#fff;--tx:#1f2430;--mu:#6a7080;--ln:#e1e4ea;--in:#fff;--ro:#eef0f4;--ac:#f26b2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--pn:#1e2026;--tx:#eef0f4;--mu:#9aa1b0;--ln:#30343d;--in:#272a32;--ro:#2a2d35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--pn:#1e2026;--tx:#eef0f4;--mu:#9aa1b0;--ln:#30343d;--in:#272a32;--ro:#2a2d35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hd{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.hd .lg{width:120px;aspect-ratio:119/42;background:#fff;border-radius:8px;padding:5px 10px;box-sizing:content-box}
.hd b{display:block;font-size:15px}.hd small{color:var(--mu)}
.ha{margin-left:auto;display:flex;gap:8px}
.bt{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.b2{background:none;border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding:20px;max-width:1280px;margin:0 auto}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:16px;font-weight:600;margin:0 0 12px}.hint{margin:-6px 0 16px;color:var(--mu);font-size:13px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{background:none;border:2px solid transparent;border-radius:10px;padding:4px;cursor:pointer;text-align:center}.th:hover{border-color:var(--ln)}
.th[aria-pressed=true]{border-color:var(--ac)}
.th span{display:block;margin-top:4px;font-size:12px;color:var(--mu)}
.up,.add{width:100%;height:40px;padding:0 12px;border:1px solid var(--ln);background:var(--in);border-radius:8px;cursor:pointer;margin-top:12px;font-weight:600}
.add{border-style:dashed;margin-top:4px}.add:disabled{opacity:.4;cursor:not-allowed}
.nt{font-size:12px;color:var(--mu);text-align:center;margin:6px 0 0}
.rule{margin-bottom:16px}.rule label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mi{flex:1;min-width:180px;height:40px;border:1px solid var(--ln);background:var(--in);border-radius:8px;padding:0 12px}
.sp{flex:none;width:220px;height:40px;display:flex;align-items:center;gap:8px;background:var(--ro);border:1px solid var(--ln);border-radius:8px;padding:0 10px;white-space:nowrap;font-size:13px}.sv{flex:1;min-width:0;display:flex;align-items:center;gap:3px}.rg{font-weight:600;font-variant-numeric:tabular-nums}
.sl{flex:none;color:var(--mu);font-size:12px}
.fi{width:52px;height:28px;border:1px solid var(--ln);background:var(--in);border-radius:6px;padding:0 6px;text-align:center;-moz-appearance:textfield;appearance:textfield}.fi::-webkit-inner-spin-button,.fi::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.fi[aria-invalid=true]{border-color:#d92d20;box-shadow:0 0 0 2px #d92d2033}
.ic{flex:none;width:36px;height:36px;border:0;background:none;color:var(--mu);cursor:pointer;border-radius:8px;display:grid;place-items:center}
button.ic:hover{background:var(--ro)}
.rule.act .mi{border-color:var(--ac);box-shadow:0 0 0 2px #f26b2a33}
.us{display:inline-flex;align-items:center;gap:6px;height:40px;background:#1f2430;color:#fff;border:0;border-radius:8px;padding:0 14px;cursor:pointer;white-space:nowrap}
.us img{height:18px;border-radius:2px;background:#fff}
.sw{display:flex;align-items:center;gap:8px;font-weight:600;position:relative;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{width:38px;height:22px;border-radius:11px;background:var(--mu);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i::after{left:19px}
.sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.off{opacity:.4;pointer-events:none}
.pv{position:sticky;top:12px;align-self:start}
.pvh{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pvh label{flex:1;display:flex;align-items:center;gap:8px;color:var(--mu);min-width:200px}
.pvh input{flex:1;min-width:90px;accent-color:var(--ac)}
.chip{background:var(--ro);border-radius:99px;padding:3px 12px;font-weight:600}
#ts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#1f2430;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
#ts.on{opacity:1;transform:translate(-50%,0)}
.cw{container-type:inline-size}
.cert{--cb:#fff;--ct:#222;--ca:#f26b2a;--cbd:#d9dce3;aspect-ratio:1.414;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 1px 8px #0003;color:var(--ct);background-color:var(--cb);display:flex;flex-direction:column;align-items:center;text-align:center;padding:6cqw 8cqw 8cqw;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.cert::before{content:"";position:absolute;inset:2.6cqw;border:.2cqw solid var(--cbd);pointer-events:none}
.cert[data-t=default]{background-image:radial-gradient(#0000000f 1px,transparent 1.3px);background-size:9px 9px}
.cert[data-t=green]{--cb:#f1eed8;--ct:#2e3d2a;--ca:#b08d3c;--cbd:#7f9c70}
.cert[data-t=ocean]{--cb:#1e2a5a;--ct:#f4f4fa;--ca:#d9b44a;--cbd:#d9b44a}
.cert[data-t=burg]{--cb:#6a2217;--ct:#f7e9d3;--ca:#e0b04c;--cbd:#e0b04c}
.cert[data-t=silver]{--cb:#eceff4;--ct:#27324a;--ca:#5d6e8c;--cbd:#9aa8bd}
.cert[data-t=sand]{--cb:#f7f0e1;--ct:#3a2e1c;--ca:#a8793a;--cbd:#c9b48a}
.cert[data-t=green]::before,.cert[data-t=ocean]::before,.cert[data-t=burg]::before{border-width:.45cqw;inset:2.2cqw}
.cert[data-t=custom]{background-size:cover;background-position:center}
.cert[data-t=custom]::before{display:none}
.lgw{padding:.6cqw 2cqw;border-radius:3cqw}
.cert[data-t=ocean] .lgw,.cert[data-t=burg] .lgw{background:#fff}
.cert .lg{width:18cqw;aspect-ratio:119/42;display:block}
.dt{font-size:1.4cqw;margin-top:2cqw;opacity:.85}
.ti{font:600 3.2cqw Georgia,"Times New Roman",serif;letter-spacing:.9cqw;margin:2.2cqw 0 1.4cqw}
.rl{width:6cqw;height:.3cqw;background:var(--ca);margin:.8cqw 0 2.6cqw}
.nm{font-size:2.2cqw;font-weight:500}
.ms{font-size:1.6cqw;margin:1.5cqw 0 1.3cqw;padding:.5cqw 1.4cqw;border-radius:1cqw;min-height:2.6cqw;transition:outline-color .2s;outline:.25cqw solid transparent;outline-offset:.5cqw}
.ms.on{outline-color:#f26b2a}
.cn{font-size:2.1cqw;font-weight:500}.sc{font-size:1.5cqw;margin-top:1.1cqw}
.sg{margin-top:auto;width:100%;display:flex;justify-content:space-around;align-items:flex-end;gap:2cqw;font-size:1.4cqw}
.sg>div{min-width:14cqw}
.sig{height:5.5cqw;display:flex;align-items:flex-end;justify-content:center;border-bottom:.2cqw solid var(--cbd);margin-bottom:.6cqw;font:italic 3.2cqw "Brush Script MT","Segoe Script","Snell Roundhand",cursive}
.sig img{max-height:5.5cqw;max-width:14cqw}
.vf{position:absolute;left:0;right:0;bottom:3.8cqw;font-size:.9cqw;opacity:.75}.vf span{color:var(--ca)}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}.pv{position:static;order:-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const TP=[['default','Default'],['green','Greenish'],['ocean','Ocean'],['burg','Burgundy'],['silver','Silver'],['sand','Sand']];

let S,uid=10,tm;
const init=()=>({t:'default',cu:null,score:100,on:true,
 rules:[{id:1,l:'Completion message',m:'has successfully earned the super nova badge.',f:90},{id:2,l:'Distinction message',m:'has completed the course with distinction.',f:80},{id:3,l:'Merit message',m:'has completed the course with merit.',f:70},{id:4,l:'Pass message',m:'has met the course requirements.',f:60}],
 re:{m:'is encouraged to review and try again.'},
 sg:[{id:1,r:'Managing Director',n:'John Doe',img:null},{id:2,r:'Trainer',n:'Marko Polo',img:null}]});
const hi=i=>i?S.rules[i-1].f-1:100,bd=i=>[i<S.rules.length-1?S.rules[i+1].f+1:1,i?S.rules[i-1].f-1:99];
const rep=k=>k==='r'?S.rules[S.rules.length-1].f-1:hi(S.rules.findIndex(r=>r.id===k));
const mt=sc=>{const r=S.rules.find(r=>sc>=r.f);return r?r.id:(S.re?'r':0)};
const txt=k=>k==='r'?S.re.m:k?S.rules.find(r=>r.id===k).m:'has successfully passed the course';
const ci=o=>`<div class="lgw"><svg class="lg"><use href="#lg"/></svg></div><div class="dt">On ${D}</div><div class="ti">COURSE CERTIFICATE</div><div class="rl"></div><div class="nm">Kamruzzaman</div><div class="ms${o.p?' on':''}">${esc(o.m)||'&nbsp;'}</div><div class="cn">How to report a bug</div><div class="sc">with a score of ${o.s}%</div>${o.g.length?`<div class="sg">${o.g.map(g=>`<div><div class="sig">${g.img?`<img src="${g.img}" alt="">`:esc(g.n)}</div>${esc(g.r)}</div>`).join('')}</div>`:''}${o.th?'':'<div class="vf">Verify certificate by link: <span>https://certificates.easygenerator.com/68b63020f393360007a65bd6.pdf</span></div>'}`;
function paint(p){const k=mt(S.score),c=$('#cert');c.dataset.t=S.t;c.style.backgroundImage=S.t==='custom'&&S.cu?`url("${S.cu.u}")`:'';
 c.innerHTML=ci({m:txt(k),s:S.score,g:S.on?S.sg:[],p});$('#scv').textContent=S.score+'%';$('#sc').value=S.score;
 document.querySelectorAll('#rl .rule').forEach(e=>e.classList.toggle('act',e.dataset.k===String(k)))}
const pulse=()=>{paint(1);clearTimeout(tm);tm=setTimeout(()=>paint(0),1400)};
function rg(){const n=S.rules.length;S.rules.forEach((r,i)=>{const w=$(`#rl [data-k="${r.id}"]`),e=w&&w.querySelector('.rg'),f=w&&w.querySelector('.fi'),[lo,h]=bd(i);if(e)e.textContent=i?`% – ${hi(i)}%`:'% or above';if(f){f.min=lo;f.max=h;f.title=`Enter a score from ${lo}% to ${h}%`}});const e=$('#rl [data-k="r"] .rg');if(e)e.textContent=`Below ${S.rules[n-1].f}%`;$('#ar').disabled=S.rules[n-1].f<=1}
function rl(){$('#rl').innerHTML=S.rules.map((r,i)=>`<div class="rule" data-k="${r.id}"><label>${esc(r.l)}</label><div class="rw"><input class="mi" value="${esc(r.m)}" aria-label="${esc(r.l)}"><span class="sp"><span class="sl">Score range</span><span class="sv"><input class="fi" type="number" inputmode="numeric" value="${r.f}" aria-label="Lowest score for ${esc(r.l)}"><b class="rg"></b></span></span>${i?`<button class="ic" aria-label="Delete ${esc(r.l)}">${TR}</button>`:'<span class="ic"></span>'}</div></div>`).join('')
 +(S.re?`<div class="rule" data-k="r"><label>Retry message</label><div class="rw"><input class="mi" value="${esc(S.re.m)}" aria-label="Retry message"><span class="sp"><span class="sl">Score range</span><span class="sv"><b class="rg"></b></span></span><button class="ic" aria-label="Delete retry message">${TR}</button></div></div>`:'');
 rg();$('#ar').disabled=S.rules[S.rules.length-1].f<=1;paint(0)}
const key=e=>{const w=e.target.closest('.rule');if(!w)return null;return w.dataset.k==='r'?'r':+w.dataset.k};
$('#rl').addEventListener('input',e=>{const k=key(e);if(k===null)return;
 if(e.target.classList.contains('mi'))(k==='r'?S.re:S.rules.find(r=>r.id===k)).m=e.target.value;
 else if(e.target.classList.contains('fi')){const[lo,h]=bd(S.rules.findIndex(r=>r.id===k)),v=e.target.value;e.target.setAttribute('aria-invalid',v===''||+v<lo||+v>h);return}
 S.score=rep(k);pulse()});
$('#rl').addEventListener('change',e=>{if(!e.target.classList.contains('fi'))return;const k=key(e),i=S.rules.findIndex(r=>r.id===k),[lo,h]=bd(i),raw=e.target.value,v=Math.round(+raw);if(raw!==''&&isFinite(v))S.rules[i].f=Math.max(lo,Math.min(h,v));e.target.value=S.rules[i].f;e.target.removeAttribute('aria-invalid');rg();S.score=rep(k);pulse()});
$('#rl').addEventListener('focusin',e=>{const k=key(e);if(k===null||e.target.tagName!=='INPUT')return;S.score=rep(k);pulse()});
$('#rl').addEventListener('click',e=>{const b=e.target.closest('button.ic');if(!b)return;const k=b.closest('.rule').dataset.k;if(k==='r')S.re=null;else S.rules=S.rules.filter(r=>r.id!==+k);S.score=100;rl()});
$('#ar').onclick=()=>{const l=S.rules[S.rules.length-1].f,id=++uid;S.rules.push({id,l:'Custom message '+(S.rules.length-3),m:'has completed the course.',f:l>6?l-5:1});S.score=rep(id);rl();$(`#rl [data-k="${id}"] .mi`).focus()};
function th(){const g=[{n:'John Doe',r:'Managing Director'},{n:'Marko Polo',r:'Trainer'}];
 $('#tg').innerHTML=TP.concat(S.cu?[['custom','Custom']]:[]).map(([t,n])=>`<button class="th" data-t="${t}" aria-pressed="${S.t===t}"><div class="cw" aria-hidden="true"><div class="cert" data-t="${t}"${t==='custom'?` style="background-image:url('${S.cu.u}')"`:''}>${ci({m:'has successfully passed the course',s:100,g,th:1})}</div></div><span>${n}</span></button>`).join('')}
$('#tg').onclick=e=>{const b=e.target.closest('.th');if(!b)return;S.t=b.dataset.t;th();paint(0)};
$('#ub').onclick=()=>$('#cf').click();
$('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;S.cu={u:URL.createObjectURL(f),n:f.name};S.t='custom';th();paint(0);$('#un').textContent='Custom design added: '+f.name+'. Leave space in your design for the certificate text and logo.'};
function sl(){$('#sl').innerHTML=S.sg.map(g=>`<div class="rule" data-i="${g.id}"><label>Signature (150×150 px, png/jpg)</label><div class="rw"><input class="mi ri" value="${esc(g.r)}" aria-label="Signatory title"><button class="us">${g.img?`<img src="${g.img}" alt="">Replace`:'Upload Signature'}</button><input class="fl" type="file" accept="image/png,image/jpeg" hidden><button class="ic dl" aria-label="Remove signatory">${TR}</button></div></div>`).join('')}
const gi=e=>S.sg.find(g=>g.id===+e.target.closest('.rule').dataset.i);
$('#sl').addEventListener('input',e=>{if(e.target.classList.contains('ri')){gi(e).r=e.target.value;paint(0)}});
$('#sl').addEventListener('click',e=>{const u=e.target.closest('.us'),d=e.target.closest('.dl');if(u)u.parentNode.querySelector('.fl').click();if(d){S.sg=S.sg.filter(g=>g!==gi(e));sl();paint(0)}});
$('#sl').addEventListener('change',e=>{if(!e.target.classList.contains('fl')||!e.target.files[0])return;gi(e).img=URL.createObjectURL(e.target.files[0]);sl();paint(0)});
$('#sa').onclick=()=>{S.sg.push({id:++uid,r:'Signatory',n:NM[S.sg.length%NM.length],img:null});sl();paint(0)};
$('#sgT').onchange=e=>{S.on=e.target.checked;$('#sb').classList.toggle('off',!S.on);paint(0)};
$('#sc').oninput=e=>{S.score=+e.target.value;paint(0)};
$('#sv').onclick=()=>{const t=$('#ts');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
function all(){S=init();$('#sgT').checked=true;$('#sb').classList.remove('off');$('#un').textContent='Leave space in your custom design for the certificate text and logo.';th();rl();sl()}
$('#rs').onclick=all;all();
</script></body></html>
